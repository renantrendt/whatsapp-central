<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whatsapp Central</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <div id="side-rail">
          <button id="side-open" class="icon-btn" title="Show sidebar (⌘\)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        </div>
        <header id="side-head">
          <nav id="tabs">
            <button data-tab="inbox" class="on">Inbox</button>
            <button data-tab="archived">Archived</button>
            <button data-tab="notes">Notes</button>
          </nav>
          <button id="side-more" class="icon-btn only-narrow" type="button" aria-label="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          <button id="side-toggle" class="icon-btn" title="Hide sidebar (⌘\)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        </header>
        <div id="list"></div>
        <div id="side-resize" title="Drag to resize. Double-click to hide."></div>
      </aside>

      <main id="main">
        <div id="empty">
          <img id="empty-logo" src="logo.svg" alt="" width="64" height="64" />
          <h1>Whatsapp Central</h1>
          <p id="empty-text"></p>
          <button id="empty-connect" class="primary" hidden>Connect account</button>
        </div>

        <section id="chat" hidden>
          <header id="chat-head">
            <button class="back-btn icon-btn only-narrow" type="button" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <div id="chat-avatar" class="avatar"></div>
            <div class="chat-title">
              <div id="chat-name"></div>
              <div id="chat-sub"></div>
            </div>
            <button id="chat-call" class="icon-btn" type="button" title="Call in the calls window" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
          </header>
          <div id="messages"></div>
          <div id="staged" hidden>
            <img id="staged-img" alt="" />
            <span>Photo. Type a caption below, or just press Send.</span>
            <button id="staged-remove" class="icon-btn" type="button" aria-label="Remove photo">✕</button>
          </div>
          <form id="composer">
            <button id="attach" class="icon-btn" type="button" title="Send a photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg></button>
            <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
            <textarea id="input" rows="1" placeholder="Message"></textarea>
            <button id="mic" class="icon-btn" type="button" title="Record a voice message"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <button id="send" type="submit" hidden>Send</button>
          </form>
          <div id="recorder" hidden>
            <button id="rec-cancel" class="icon-btn" type="button" aria-label="Cancel recording">✕</button>
            <span class="rec-dot"></span>
            <span id="rec-time">0:00</span>
            <span class="rec-hint">Recording</span>
            <button id="rec-send" type="button">Send</button>
          </div>
        </section>

        <section id="note" hidden>
          <header id="note-head">
            <button class="back-btn icon-btn only-narrow" type="button" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <input id="note-title" type="text" placeholder="Title" autocomplete="off" />
          </header>
          <div id="note-body">
            <div id="note-editor" contenteditable="true" spellcheck="true"
              data-placeholder="Write anything. Type / for lists and to-dos."></div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialog-close">Close</button>
      </div>
    </dialog>

    <div id="ctx" hidden></div>

    <div id="bubble" hidden>
      <button type="button" data-fmt="bold" title="Bold (⌘B)"><b>B</b></button>
      <button type="button" data-fmt="bullet" title="Bullet list">• List</button>
      <button type="button" data-fmt="number" title="Numbered list">1. List</button>
      <button type="button" data-fmt="check" title="To-do list">☑ To-do</button>
    </div>

    <div id="slash" hidden></div>

    <div id="palette" hidden>
      <div id="palette-box">
        <input id="palette-input" type="text" placeholder="Find a conversation" autocomplete="off" spellcheck="false" />
        <div id="palette-list"></div>
      </div>
    </div>

    <script src="tlds.js"></script>
    <script src="app.js"></script>
  </body>
</html>
